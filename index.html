<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certification Decision Assessment for German E-Commerce SMEs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F6F4;
    --paper-card:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B6472;
    --accent:#2E4B66;
    --accent-dark:#1F3547;
    --accent-tint:#EAF0F5;
    --rule:#DEE1E4;
    --rule-strong:#C3C8CD;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Source Sans 3',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:36px 24px 80px;
  }

  /* ---------- Header ---------- */
  header{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    padding-bottom:22px;
    border-bottom:1px solid var(--rule-strong);
    margin-bottom:8px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand-mark{
    width:34px;height:34px;
    border:1.5px solid var(--accent);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Source Serif 4',serif;
    font-size:14px;font-weight:600;
    color:var(--accent);
    flex-shrink:0;
  }
  .brand-text h1{
    font-family:'Source Serif 4',serif;
    font-size:20px;
    font-weight:600;
    margin:0;
    letter-spacing:-0.01em;
    line-height:1.15;
  }
  .brand-text p{
    margin:2px 0 0;
    font-size:12px;
    color:var(--ink-soft);
    font-family:'Source Sans 3',sans-serif;font-weight:600;
    letter-spacing:0.06em;
    text-transform:uppercase;
  }
  .progress-label{
    font-family:'Source Sans 3',sans-serif;font-weight:600;
    font-size:11px;
    color:var(--ink-soft);
    text-align:right;
    white-space:nowrap;
    padding-top:6px;
    letter-spacing:0.06em;
    text-transform:uppercase;
  }

  /* ---------- Trail ---------- */
  .trail{
    display:flex;
    gap:6px;
    margin:22px 0 6px;
    flex-wrap:wrap;
  }
  .trail-chip{
    font-family:'Source Sans 3',sans-serif;font-weight:600;
    font-size:10.5px;
    letter-spacing:0.03em;
    padding:5px 10px;
    border:1px solid var(--rule-strong);
    border-radius:20px;
    color:var(--ink-soft);
    background:var(--paper-card);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .trail-chip .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--accent);
    flex-shrink:0;
  }
  .trail-chip.no .dot{background:transparent;border:1.5px solid var(--ink-soft);}

  /* ---------- Card / stage ---------- */
  main{ margin-top:30px; min-height:420px; position:relative; }
  .stage{
    animation:fadeIn .35s ease;
  }
  @keyframes fadeIn{
    from{opacity:0;transform:translateY(6px);}
    to{opacity:1;transform:translateY(0);}
  }

  .eyebrow{
    font-family:'Source Sans 3',sans-serif;font-weight:600;
    font-size:12px;
    color:var(--accent);
    text-transform:uppercase;
    letter-spacing:0.08em;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:"";
    width:16px;height:1px;
    background:var(--accent);
    display:inline-block;
  }

  .question{
    font-family:'Source Serif 4',serif;
    font-size:clamp(24px,4vw,32px);
    font-weight:500;
    line-height:1.28;
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  .question-help{
    font-size:14.5px;
    color:var(--ink-soft);
    line-height:1.55;
    max-width:56ch;
    margin:0 0 30px;
  }

  .choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media(max-width:520px){ .choices{grid-template-columns:1fr;} }

  .choice-btn{
    text-align:left;
    background:var(--paper-card);
    border:1.5px solid var(--rule-strong);
    border-radius:var(--radius);
    padding:20px 20px 18px;
    cursor:pointer;
    font-family:'Source Sans 3',sans-serif;
    transition:border-color .18s ease, background .18s ease, transform .12s ease;
    position:relative;
  }
  .choice-btn:hover{
    border-color:var(--ink);
    transform:translateY(-1px);
  }
  .choice-btn:active{ transform:translateY(0); }
  .choice-btn .k{
    font-family:'Source Sans 3',sans-serif;font-weight:600;
    font-size:11px;
    color:var(--accent);
    letter-spacing:0.05em;
    display:block;
    margin-bottom:8px;
  }
  .choice-btn .label{
    font-size:16.5px;
    font-weight:600;
    color:var(--ink);
    display:block;
    margin-bottom:5px;
  }
  .choice-btn .sub{
    font-size:13px;
    color:var(--ink-soft);
    line-height:1.4;
  }
  .choice-btn.yes:hover{ background:var(--accent-tint); }

  .back-link{
    margin-top:26px;
    background:none;border:none;
    font-family:'Source Sans 3',sans-serif;font-weight:600;
    font-size:12px;
    color:var(--ink-soft);
    cursor:pointer;
    padding:6px 0;
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .back-link:hover{ color:var(--ink); }

  /* ---------- Intro ---------- */
  .intro h2{
    font-family:'Source Serif 4',serif;
    font-size:clamp(26px,4.2vw,34px);
    font-weight:600;
    line-height:1.22;
    margin:0 0 14px;
    letter-spacing:-0.01em;
  }
  .intro p{
    font-size:15px;
    color:var(--ink-soft);
    line-height:1.65;
    max-width:58ch;
    margin:0 0 16px;
  }
  .intro .grounding{
    font-family:'Source Sans 3',sans-serif;font-weight:600;
    font-size:11.5px;
    color:var(--ink-soft);
    border-left:2px solid var(--accent);
    padding:4px 0 4px 14px;
    margin:26px 0 30px;
    max-width:56ch;
    line-height:1.6;
  }
  .start-btn{
    background:var(--ink);
    color:var(--paper-card);
    border:none;
    font-family:'Source Sans 3',sans-serif;
    font-weight:600;
    font-size:15px;
    padding:14px 26px;
    border-radius:var(--radius);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:10px;
    transition:background .18s ease;
  }
  .start-btn:hover{ background:var(--accent-dark); }
  .start-btn svg{ width:14px;height:14px; }

  /* ---------- Result / Certificate ---------- */
  .cert{
    border:1.5px solid var(--ink);
    background:var(--paper-card);
    padding:44px 36px 34px;
    position:relative;
    text-align:center;
  }
  .cert::before,
  .cert::after{
    content:"";
    position:absolute;
    width:16px;height:16px;
    border:1.5px solid var(--ink);
  }
  .cert::before{ top:8px;left:8px; border-right:none;border-bottom:none; }
  .cert::after{ bottom:8px;right:8px; border-left:none;border-top:none; }

  .seal-medal{
    width:76px;height:76px;
    margin:0 auto 22px;
    border-radius:50%;
    background:var(--ink);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 0 4px var(--paper-card), 0 0 0 5px var(--rule-strong);
    position:relative;
  }
  .seal-medal span{
    font-family:'Source Serif 4',serif;
    font-size:26px;
    font-weight:600;
    color:var(--paper-card);
  }

  .cert-eyebrow{
    font-family:'Source Sans 3',sans-serif;font-weight:600;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .cert h2{
    font-family:'Source Serif 4',serif;
    font-size:clamp(22px,3.6vw,28px);
    font-weight:600;
    line-height:1.28;
    margin:0 0 16px;
    letter-spacing:-0.01em;
  }
  .cert-body{
    font-size:14.5px;
    line-height:1.7;
    color:var(--ink);
    text-align:left;
    max-width:54ch;
    margin:0 auto 22px;
  }
  .cert-tags{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:26px;
  }
  .tag{
    font-family:'Source Sans 3',sans-serif;font-weight:600;
    font-size:11px;
    padding:5px 11px;
    border:1px solid var(--rule-strong);
    border-radius:20px;
    color:var(--accent);
    background:var(--accent-tint);
  }
  .cert-actions{
    display:flex;
    gap:10px;
    justify-content:center;
    padding-top:20px;
    border-top:1px solid var(--rule-strong);
    flex-wrap:wrap;
  }
  .btn-secondary{
    background:none;
    border:1.5px solid var(--ink);
    color:var(--ink);
    font-family:'Source Sans 3',sans-serif;
    font-weight:600;
    font-size:13.5px;
    padding:11px 20px;
    border-radius:var(--radius);
    cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  .btn-secondary:hover{ background:var(--ink); color:var(--paper-card); }

  footer{
    margin-top:50px;
    padding-top:18px;
    border-top:1px solid var(--rule);
    font-size:12px;
    color:var(--ink-soft);
    line-height:1.65;
    font-family:'Source Sans 3',sans-serif;font-weight:400;
  }

  @media print{
    body{background:#fff;}
    header .progress-label, .trail, .back-link, .start-btn, .cert-actions, footer .no-print{display:none;}
    .wrap{max-width:100%;padding:0;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <div class="brand-mark">CD</div>
      <div class="brand-text">
        <h1>Certification Decision Assessment</h1>
        <p>FOR GERMAN E-COMMERCE SMEs</p>
      </div>
    </div>
    <div class="progress-label" id="progressLabel">START</div>
  </header>

  <div class="trail" id="trail"></div>

  <main id="main"></main>

  <footer>
    <div class="no-print" id="footerGrounding"></div>
    <div class="no-print" id="footerDisclaimer" style="margin-top:6px;"></div>
  </footer>

</div><script>
/* ======================================================================
   CERTIFICATION DECISION ASSESSMENT — CONFIG-DRIVEN ENGINE
   ======================================================================
   HOW THIS FILE IS ORGANISED
   1. ASSESSMENT_CONFIG   — all content: questions, branches, outcomes.
                              This is the ONLY section you should need to
                              edit to update wording, add a question, add
                              an outcome, or restructure the decision tree.
   2. ENGINE               — generic code that reads the config above and
                              renders/routes the assessment. It has no
                              knowledge of certification, SMEs, or any
                              specific question — it just walks whatever
                              tree ASSESSMENT_CONFIG describes. You should
                              not need to touch this section to maintain
                              or extend the assessment content.

   HOW TO MAKE FUTURE CHANGES
   - Edit an existing question's wording/options → edit its entry in
     QUESTIONS below. Nothing else needs to change.
   - Add a brand-new question → add an entry to QUESTIONS with a unique
     id, then point an existing branch's `next` at that id instead of a
     result letter. Add a `back` pointer on the new question.
   - Add a new outcome → add an entry to RESULTS with a new key, then
     point any branch's `next` at that key (the engine treats any
     `next` value that matches a RESULTS key as a final outcome, and
     any value matching a QUESTIONS key as the next question).
   - Change the number of steps in a branch → update `totalSteps` on the
     relevant question entries so the "Q_ OF _" progress label stays
     accurate. Nothing else depends on step count.
   - Update the thesis grounding text, version, or last-updated date →
     see META at the top of ASSESSMENT_CONFIG.
   ====================================================================== */

const ASSESSMENT_CONFIG = {

  META: {
    version: '2.0.0',
    lastUpdated: '2026-08-26',
    // Shown on the intro screen and in the footer.
    title: 'Should your SME pursue, keep, or reconsider e\u2011commerce certification?',
    introEyebrow: 'Four questions \u00b7 about 60 seconds',
    introBody: `This assessment walks through the same decision logic developed in Chapter Eight of the underlying thesis research: certified SMEs are considerably more concentrated in the top Trustpilot rating band, yet certification status alone does not statistically predict rating once firm size and review activity are controlled. What predicts the outcome is <em>how</em> a firm approaches the decision, and that is what this assessment is built to surface.`,
    introGrounding: 'SIX POSSIBLE OUTCOMES \u00b7 MAPPED TO SECTIONS 8.1\u20138.4 OF THE SOURCE THESIS',
    footerGrounding: `Grounded in the Technology, Organization, and Environment framework (Tornatzky &amp; Fleischer, 1990) and the empirical findings of Ebeleme (2026), <em>E-Commerce Certification for German SMEs: A Study of Online Reputation and the Perceived Value of the Certification Process</em>, Leipzig University.`,
    footerDisclaimer: 'This tool is a decision-support heuristic developed from formal academic research. See Figure 8.1 and Section 8.4 of the source thesis for full grounding and boundary conditions.'
  },

  // The id of the question the assessment opens on.
  startQuestion: 'certified',

  // ---- QUESTIONS -------------------------------------------------------
  // Each key is a unique question id. `next` on each option points to
  // either another question id, or a RESULTS key (ending the assessment).
  // `trailLabel` is what shows up in the progress chips at the top.
  QUESTIONS: {

    certified: {
      trailLabel: 'Certified?',
      eyebrow: 'Starting point',
      totalSteps: 3,
      stepNumber: 1,
      question: 'Is your SME currently certified? (e.g. Trusted Shops)',
      help: 'This determines which of the two assessment paths applies to your business.',
      back: null,
      options: {
        left: {
          value: 'no', k: 'NOT CERTIFIED', label: 'No, not yet',
          sub: 'We rely on other trust-building approaches, or haven\u2019t considered it closely.',
          next: 'audience'
        },
        right: {
          value: 'yes', k: 'CERTIFIED', label: 'Yes, already certified',
          sub: 'We hold an active certification and are weighing renewal or its value.',
          next: 'tracking'
        }
      }
    },

    audience: {
      trailLabel: 'Audience',
      eyebrow: 'Environmental context',
      totalSteps: 3,
      stepNumber: 2,
      question: 'Is your customer base mostly anonymous or transactional, or are you expanding into new or unfamiliar markets?',
      help: 'Certification\u2019s trust-transfer value is strongest precisely where personal, relationship-based trust cannot reach.',
      back: 'certified',
      options: {
        left: {
          value: 'yes', k: 'YES', label: 'Anonymous, transactional, or expanding',
          sub: 'Many first-time or distant customers who don\u2019t know us yet.',
          next: 'capacity'
        },
        right: {
          value: 'no', k: 'NO', label: 'Established, relational customer base',
          sub: 'Most customers already know and trust us through relationship or reputation.',
          next: 'C'
        }
      }
    },

    capacity: {
      trailLabel: 'Capacity',
      eyebrow: 'Organisational context',
      totalSteps: 3,
      stepNumber: 3,
      question: 'Does your firm have dedicated capacity to manage certification\u2019s administrative burden?',
      help: 'Think: staff time, a medium-plus firm size, or someone who could realistically own this ongoing.',
      back: 'audience',
      options: {
        left: {
          value: 'yes', k: 'YES', label: 'We have the capacity',
          sub: 'Someone can realistically own the audit process and annual renewal.',
          next: 'A'
        },
        right: {
          value: 'no', k: 'NO', label: 'Not right now',
          sub: 'Our team is lean and roles already overlap heavily.',
          next: 'B'
        }
      }
    },

    tracking: {
      trailLabel: 'Tracking',
      eyebrow: 'Technological / procedural context',
      totalSteps: 3,
      stepNumber: 2,
      question: 'Do you have a way to measure certification\u2019s specific contribution to your reputation or sales?',
      help: 'For example: rating trends tracked around renewal dates, or customer feedback that asks directly.',
      back: 'certified',
      options: {
        left: {
          value: 'no', k: 'NO', label: 'Not currently tracked',
          sub: 'We renew because it feels expected, not because we\u2019ve measured a return.',
          next: 'D'
        },
        right: {
          value: 'yes', k: 'YES', label: 'We do track this',
          sub: 'We have some evidence, even informal, of certification\u2019s effect.',
          next: 'evidence'
        }
      }
    },

    evidence: {
      trailLabel: 'Evidence',
      eyebrow: 'Evidence check',
      totalSteps: 3,
      stepNumber: 3,
      question: 'Does the evidence you have show a measurable reputational or commercial return?',
      help: 'Be honest here. Unclear or mixed evidence is a very common, informative answer.',
      back: 'tracking',
      options: {
        left: {
          value: 'yes', k: 'YES', label: 'Clearly, yes',
          sub: 'Rating, reviews, or sales visibly respond to certification status.',
          next: 'E'
        },
        right: {
          value: 'no', k: 'NO / UNCLEAR', label: 'No, or hard to tell',
          sub: 'The link isn\u2019t obvious, or other factors seem to matter more.',
          next: 'F'
        }
      }
    }
  },

  // ---- RESULTS -----------------------------------------------------
  RESULTS: {
    A: {
      title: 'Pursue certification and build in measurement from day one',
      tags: ['Environmental', 'Organisational', 'Section 8.1'],
      body: `Your customer context and organisational capacity both point toward certification being worth the investment. Before you sign up, decide now how you will track its effect, for example by watching your Trustpilot rating and review pace around your renewal date, or by asking new customers whether the certification badge influenced their decision. Certified managers in the underlying research consistently found it difficult to say afterward whether certification had worked. Establish that measurement in advance.`
    },
    B: {
      title: 'Build capacity first, then revisit certification',
      tags: ['Organisational', 'Section 8.2'],
      body: `Certification looks like a reasonable fit for your market, but taking it on without the organisational capacity to manage it is a common source of strain in lean SMEs. Before applying, name one person as the certification owner, even part-time, and check whether your chosen provider offers a streamlined pathway sized for very small teams. Revisit this assessment once that capacity is in place.`
    },
    C: {
      title: 'Keep investing in your existing trust-building strengths',
      tags: ['Environmental', 'Section 5.4.2'],
      body: `With an established, relationship-driven customer base, formal certification is likely to add less than what you already have. The SME managers in the underlying research who thrived without certification did so through deliberate, active work: soliciting reviews, being visibly responsive to customer questions and complaints, and being transparent about their products. Continue that practice, and revisit certification specifically if your customer base begins to shift toward new or unfamiliar markets.`
    },
    D: {
      title: 'Start measuring before your next renewal decision',
      tags: ['Technological', 'Section 8.1'],
      body: `You are already certified, which is a sound position, although renewing on assumption rather than evidence leaves value on the table either way. Before your next renewal, put a simple tracking habit in place: note your rating and review volume now, check again a few months on, and ask a handful of customers directly whether the badge mattered to them. That gives your next renewal decision a firmer basis.`
    },
    E: {
      title: 'Continue certification and put your evidence to work',
      tags: ['Technological', 'Section 8.1'],
      body: `You have both certification and evidence that it is contributing to your reputation or sales. This is a genuinely strong position, and a less common one than you might expect. Make this evidence visible: reference it in your renewal decision, and consider using it directly in marketing or customer communication, since a demonstrated result is a more persuasive claim than the badge alone.`
    },
    F: {
      title: 'Reassess without assuming you should drop it',
      tags: ['Institutional', 'Section 6.4'],
      body: `Unclear evidence of a measurable return does not automatically mean certification is not worth keeping. Research into certified German SMEs found that certification often functions as a marker of legitimacy within a sector, helping the firm avoid a competitive disadvantage, even where it does not show up as a direct reputational boost. Before dropping it, consider what your customers or industry peers would read into its absence, not only what it visibly adds.`
    }
  }
};


/* ======================================================================
   ENGINE — generic; reads ASSESSMENT_CONFIG only. Do not hardcode any
   question/result content below this line.
   ====================================================================== */
(function(){
  const CFG = ASSESSMENT_CONFIG;
  const trailEl = document.getElementById('trail');
  const mainEl = document.getElementById('main');
  const progressEl = document.getElementById('progressLabel');

  // state.path: ordered list of {questionId, trailLabel, value} for every
  // answer given so far. Fully generic — works for any question count.
  let state = { path: [] };

  function icon(kind){
    if(kind==='arrow') return '<svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 7H12M12 7L7.5 2.5M12 7L7.5 11.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    return '';
  }

  function renderTrail(){
    trailEl.innerHTML = state.path.map(step =>
      `<span class="trail-chip ${step.value==='no' ? 'no' : ''}"><span class="dot"></span>${step.trailLabel}: ${step.value.toUpperCase()}</span>`
    ).join('');
  }

  function isResult(id){
    return Object.prototype.hasOwnProperty.call(CFG.RESULTS, id);
  }

  function renderIntro(){
    progressEl.textContent = 'START';
    state = { path: [] };
    renderTrail();
    mainEl.innerHTML = `
      <div class="stage intro">
        <div class="eyebrow">${CFG.META.introEyebrow}</div>
        <h2>${CFG.META.title}</h2>
        <p>${CFG.META.introBody}</p>
        <div class="grounding">${CFG.META.introGrounding}</div>
        <button class="start-btn" id="btnStart">Begin assessment ${icon('arrow')}</button>
      </div>
    `;
    document.getElementById('btnStart').onclick = () => renderQuestion(CFG.startQuestion);
  }

  function renderQuestion(questionId){
    const q = CFG.QUESTIONS[questionId];
    progressEl.textContent = `Q${q.stepNumber} OF ${q.totalSteps}`;

    mainEl.innerHTML = `
      <div class="stage">
        <div class="eyebrow">${q.eyebrow}</div>
        <h2 class="question">${q.question}</h2>
        <p class="question-help">${q.help}</p>
        <div class="choices">
          <button class="choice-btn yes" id="btnL"><span class="k">${q.options.left.k}</span><span class="label">${q.options.left.label}</span><span class="sub">${q.options.left.sub}</span></button>
          <button class="choice-btn" id="btnR"><span class="k">${q.options.right.k}</span><span class="label">${q.options.right.label}</span><span class="sub">${q.options.right.sub}</span></button>
        </div>
        ${q.back ? `<button class="back-link" id="btnBack">&larr; Back</button>` : ''}
      </div>
    `;

    function choose(option){
      state.path.push({ questionId, trailLabel: q.trailLabel, value: option.value });
      renderTrail();
      advance(option.next);
    }

    document.getElementById('btnL').onclick = () => choose(q.options.left);
    document.getElementById('btnR').onclick = () => choose(q.options.right);
    if(q.back){
      document.getElementById('btnBack').onclick = () => {
        // Drop the most recent answer(s) back to (but not including) the
        // target question, so Back always lands one step behind cleanly.
        state.path.pop();
        renderTrail();
        renderQuestion(q.back);
      };
    }
  }

  // Routes to either the next question or a final result — the only
  // branch point the engine itself needs to know about.
  function advance(nextId){
    if(isResult(nextId)) renderResult(nextId);
    else renderQuestion(nextId);
  }

  function renderResult(key){
    progressEl.textContent = 'RESULT';
    const r = CFG.RESULTS[key];
    mainEl.innerHTML = `
      <div class="stage cert">
        <div class="seal-medal"><span>${key}</span></div>
        <div class="cert-eyebrow">Recommendation ${key}</div>
        <h2>${r.title}</h2>
        <div class="cert-body">${r.body}</div>
        <div class="cert-tags">${r.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        <div class="cert-actions">
          <button class="btn-secondary" id="btnPrint">Print / save result</button>
          <button class="btn-secondary" id="btnRestart">Start over</button>
        </div>
      </div>
    `;
    document.getElementById('btnPrint').onclick = () => window.print();
    document.getElementById('btnRestart').onclick = renderIntro;
  }

  // Populate footer text from config so it stays in sync with META.
  const footerGrounding = document.getElementById('footerGrounding');
  const footerDisclaimer = document.getElementById('footerDisclaimer');
  if(footerGrounding) footerGrounding.innerHTML = CFG.META.footerGrounding;
  if(footerDisclaimer) footerDisclaimer.innerHTML = CFG.META.footerDisclaimer;

  renderIntro();
})();
</script>
</body>
</html>
