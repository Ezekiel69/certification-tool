<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certification Decision Engine | German E-Commerce SMEs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #F4F3EE;
    --bg-surface: #FFFFFF;
    --bg-card: #FAF9F5;
    --bg-card-hover: #EFECE4;
    --border-subtle: #DFDCD0;
    --border-strong: #C8C3B4;
    --text-main: #181816;
    --text-muted: #625F56;
    --text-dimmed: #969185;
    --accent: #7A3E2D; 
    --success: #364A33; 
    --shadow: 0 20px 40px -12px rgba(24, 24, 22, 0.08), 0 0 0 1px rgba(24, 24, 22, 0.04);
    --radius: 6px;
    --font-serif: 'Instrument Serif', Georgia, serif;
    --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  
  body {
    background-color: var(--bg-base);
    color: var(--text-main);
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 16px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    background: var(--bg-surface);
    width: 100%;
    max-width: 860px;
    padding: 52px;
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }

  .wrap::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 5px;
    background: linear-gradient(90deg, var(--accent) 0%, #C9A15A 50%, var(--success) 100%);
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border-subtle);
    margin-bottom: 32px;
  }

  .brand-text h1 {
    font-family: var(--font-serif);
    font-size: 28px;
    font-weight: 400;
    margin: 0;
    letter-spacing: -0.01em;
    color: var(--text-main);
  }

  .brand-text p {
    margin: 4px 0 0;
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .brand-author {
    margin-top: 6px;
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    font-family: var(--font-sans);
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .ctrl-btn {
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    color: var(--text-main);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .ctrl-btn:hover {
    border-color: var(--accent);
    background: var(--bg-card-hover);
  }

  .progress-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.04em;
  }

  .trail {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .trail-chip {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 4px 10px;
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    color: var(--text-muted);
    background: var(--bg-card);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .trail-chip .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--success);
  }

  .trail-chip.no .dot {
    background: var(--text-dimmed);
  }

  .trail-chip:not(:last-child)::after {
    content: "—";
    margin-left: 6px;
    color: var(--text-dimmed);
  }

  main { min-height: 380px; position: relative; }
  
  .stage {
    animation: fadeIn 0.25s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }

  .question {
    font-family: var(--font-serif);
    font-size: clamp(30px, 4vw, 38px);
    font-weight: 400;
    line-height: 1.15;
    color: var(--text-main);
    margin: 0 0 12px;
  }

  .question-help {
    font-size: 14.5px;
    color: var(--text-muted);
    line-height: 1.6;
    max-width: 56ch;
    margin: 0 0 28px;
  }

  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .choices-multi {
    grid-template-columns: 1fr;
  }

  @media(max-width: 640px) { .choices { grid-template-columns: 1fr; } }

  .choice-btn {
    text-align: left;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    padding: 24px;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: all 0.15s ease;
  }

  .choice-btn:hover, .choice-btn:focus {
    background: var(--bg-card-hover);
    border-color: var(--text-main);
    outline: none;
  }

  .choice-btn .k {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    display: block;
    margin-bottom: 8px;
  }

  .choice-btn .label {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-main);
    display: block;
    margin-bottom: 6px;
  }

  .choice-btn .sub {
    font-size: 13.5px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .back-link {
    margin-top: 24px;
    background: none; border: none;
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .back-link:hover { color: var(--text-main); }

  .intro-card {
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    padding: 36px;
    border-radius: var(--radius);
  }

  .owner-bio {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border-subtle);
  }

  .owner-avatar {
    width: 50px; height: 50px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 15px;
  }

  .owner-details h3 {
    margin: 0 0 4px;
    font-size: 16px;
    font-weight: 600;
    color: var(--text-main);
  }

  .owner-details p {
    margin: 0;
    font-size: 13px;
    color: var(--text-muted);
  }

  .intro-card h2 {
    font-family: var(--font-serif);
    font-size: clamp(30px, 4vw, 36px);
    font-weight: 400;
    line-height: 1.2;
    margin: 0 0 14px;
    color: var(--text-main);
  }

  .intro-card p {
    font-size: 14.5px;
    color: var(--text-muted);
    line-height: 1.7;
    margin: 0 0 20px;
  }

  .instruction-box {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-left: 3px solid var(--accent);
    padding: 16px 20px;
    border-radius: 0 var(--radius) var(--radius) 0;
    margin-bottom: 28px;
  }

  .instruction-box h4 {
    margin: 0 0 6px;
    font-size: 13px;
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
  }

  .instruction-box p {
    margin: 0;
    font-size: 13.5px;
    color: var(--text-main);
    line-height: 1.5;
  }

  .start-btn {
    background: var(--text-main);
    color: var(--bg-surface);
    border: none;
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 14px;
    padding: 14px 28px;
    border-radius: var(--radius);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: background 0.15s ease;
  }
  .start-btn:hover { background: var(--accent); }

  .cert {
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    padding: 36px;
    border-radius: var(--radius);
    text-align: center;
  }

  .seal-medal {
    width: 56px; height: 56px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 0 4px var(--bg-surface), 0 0 0 5px var(--border-strong), 0 8px 16px -4px rgba(24,24,22,0.25);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-family: var(--font-mono);
    font-size: 19px;
    font-weight: 500;
  }

  .cert h2 {
    font-family: var(--font-serif);
    font-size: 28px;
    font-weight: 400;
    line-height: 1.2;
    margin: 0 0 16px;
    color: var(--text-main);
  }

  .cert-body {
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--text-muted);
    text-align: left;
    max-width: 52ch;
    margin: 0 auto 24px;
  }

  .cert-tags {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .tag {
    font-family: var(--font-mono);
    font-size: 10.5px;
    padding: 4px 10px;
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    color: var(--text-muted);
    background: var(--bg-surface);
  }

  .deepdive {
    max-width: 560px;
    margin: 0 auto 20px;
    text-align: left;
  }

  .deepdive-toggle {
    width: 100%;
    background: var(--bg-surface);
    border: 1px dashed var(--border-subtle);
    border-radius: 8px;
    padding: 10px 14px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-muted);
    cursor: pointer;
    text-align: left;
  }

  .deepdive-toggle:hover {
    border-color: var(--accent, #7c3aed);
    color: var(--text-primary);
  }

  .deepdive-panel {
    margin-top: 10px;
    padding: 16px;
    border: 1px solid var(--border-subtle);
    border-radius: 8px;
    background: var(--bg-surface);
  }

  .dd-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #7c3aed;
    margin-bottom: 8px;
  }

  .dd-intro, .dd-footnote {
    font-size: 12.5px;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .dd-footnote {
    margin-top: 10px;
    font-style: italic;
  }

  .dd-question {
    font-size: 13.5px;
    font-weight: 600;
    margin-bottom: 8px;
  }

  .dd-choices {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .dd-choices-3 .dd-btn {
    flex: 1 1 auto;
  }

  .dd-btn {
    padding: 8px 12px;
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    background: var(--bg-page, #fff);
    font-size: 12.5px;
    cursor: pointer;
  }

  .dd-btn:hover {
    border-color: #7c3aed;
  }

  .dd-result {
    font-size: 13px;
    line-height: 1.5;
    padding: 10px 0 0;
  }

  .cert-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    padding-top: 20px;
    border-top: 1px solid var(--border-subtle);
  }

  .btn-secondary {
    background: var(--bg-surface);
    border: 1px solid var(--border-strong);
    color: var(--text-main);
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-secondary:hover { border-color: var(--text-main); }

  footer {
    margin-top: 36px;
    padding-top: 16px;
    border-top: 1px solid var(--border-subtle);
    font-size: 11.5px;
    color: var(--text-dimmed);
    line-height: 1.6;
  }

  .footer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-privacy {
    margin-top: 10px;
    font-size: 10.5px;
    color: var(--text-dimmed);
    opacity: 0.85;
    max-width: 62ch;
  }

  @media print {
    @page { size: landscape; margin: 1.4cm; }
    body { background: #fff !important; padding: 0; }
    .wrap { border: none; box-shadow: none; padding: 0; max-width: none; }
    .wrap::before { height: 6px; }
    header .header-controls, .trail, .back-link, .start-btn, .cert-actions,
    .deepdive-toggle, .dd-btn, footer .no-print { display: none !important; }
    header { border-bottom: 2px solid var(--text-main); margin-bottom: 20px; }
    .stage.cert {
      display: grid;
      grid-template-columns: 1.3fr 0.9fr;
      grid-template-areas: "medal medal" "title tags" "body tags";
      column-gap: 40px;
      text-align: left;
      align-items: start;
    }
    .seal-medal { grid-area: medal; margin: 0 0 12px; }
    .cert h2 { grid-area: title; text-align: left; }
    .cert-body { grid-area: body; text-align: left; margin: 0; max-width: none; }
    .cert-tags { grid-area: tags; justify-content: flex-start; flex-direction: column; align-items: flex-start; }
    .deepdive { grid-area: tags; margin-top: 16px; }
    .deepdive-panel { display: block !important; }
    .print-footer { display: block !important; margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--border-subtle); font-family: var(--font-mono); font-size: 10px; color: var(--text-dimmed); }
  }
  .print-footer { display: none; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand-text">
      <h1 id="headerTitle">Decision Assessment Engine</h1>
      <p id="headerSub">German E-Commerce SME Framework</p>
      <div class="brand-author" id="brandAuthor"></div>
    </div>
    <div class="header-controls">
      <button class="ctrl-btn" id="langToggle" aria-label="Toggle language">DE / EN</button>
      <div class="progress-badge" id="progressLabel" aria-live="polite">WELCOME</div>
    </div>
  </header>

  <div class="trail" id="trail"></div>

  <main id="main" tabindex="-1"></main>

  <footer>
    <div class="footer-row">
      <div class="no-print" id="footerGrounding"></div>
      <div class="no-print" id="footerOwnerSig"></div>
    </div>
    <div class="no-print footer-privacy" id="footerPrivacy"></div>
  </footer>

</div>

const ASSESSMENT_CONFIG = {
  startQuestion: 'certified',
  structure: {
    certified: { nextNo: 'audience', nextYes: 'tracking', totalSteps: 3, stepNumber: 1, back: null },
    audience: { nextNo: 'C', nextYes: 'capacity', totalSteps: 3, stepNumber: 2, back: 'certified' },
    capacity: { nextNo: 'B', nextYes: 'A', totalSteps: 3, stepNumber: 3, back: 'audience' },
    tracking: { nextNo: 'D', nextYes: 'evidence', totalSteps: 3, stepNumber: 2, back: 'certified' },
    evidence: { nextNo: 'F', nextYes: 'E', totalSteps: 3, stepNumber: 3, back: 'tracking' }
  }
};

(function(){
  let currentLang = localStorage.getItem('cert_engine_lang') || 'en';
  let state = { path: [], currentView: 'intro', activeQuestion: null, certHeld: null };

  const trailEl = document.getElementById('trail');
  const mainEl = document.getElementById('main');
  const progressEl = document.getElementById('progressLabel');
  const headerTitle = document.getElementById('headerTitle');
  const headerSub = document.getElementById('headerSub');
  const brandAuthor = document.getElementById('brandAuthor');
  const langToggle = document.getElementById('langToggle');
  const footerGrounding = document.getElementById('footerGrounding');
  const footerOwnerSig = document.getElementById('footerOwnerSig');
  const footerPrivacy = document.getElementById('footerPrivacy');

  function t() { return I18N[currentLang]; }

  function updateStaticText() {
    headerTitle.textContent = t().headerTitle;
    headerSub.textContent = t().headerSub;
    brandAuthor.textContent = t().brandAuthor;
    footerGrounding.innerHTML = t().meta.footerGrounding;
    footerOwnerSig.textContent = `${t().meta.ownerName} · MBA Research Project`;
    footerPrivacy.textContent = t().meta.privacyNotice;
    langToggle.textContent = currentLang === 'en' ? 'DE / EN' : 'EN / DE';
  }

  function renderTrail(){
    trailEl.innerHTML = state.path.map(step => {
      const qConfig = t().questions[step.questionId];
      if (!qConfig) return '';
      return `<span class="trail-chip ${step.value==='no' ? 'no' : ''}"><span class="dot"></span>${qConfig.trailLabel}: ${step.value.toUpperCase()}</span>`;
    }).join('');
  }

  function renderIntro(){
    state.currentView = 'intro';
    state.path = [];
    state.activeQuestion = null;
    state.certHeld = null;
    progressEl.textContent = t().sysReady;
    renderTrail();
    mainEl.innerHTML = `
      <div class="stage intro-card">
        <div class="owner-bio">
          <div class="owner-avatar">EE</div>
          <div class="owner-details">
            <h3>${t().meta.ownerName}</h3>
            <p>${t().meta.ownerRole}</p>
          </div>
        </div>
        <h2>${t().meta.title}</h2>
        <p>${t().meta.introIntro}</p>
        <div class="instruction-box">
          <h4>${t().meta.instructionTitle}</h4>
          <p>${t().meta.instructionText}</p>
        </div>
        <button class="start-btn" id="btnStart">${t().startBtn}</button>
      </div>
    `;
    document.getElementById('btnStart').onclick = () => renderQuestion(ASSESSMENT_CONFIG.startQuestion);
    mainEl.focus();
  }

  function renderQuestion(questionId){
    state.currentView = 'question';
    state.activeQuestion = questionId;
    const qStruct = ASSESSMENT_CONFIG.structure[questionId];
    const qText = t().questions[questionId];
    progressEl.textContent = `${qStruct.stepNumber} / ${qStruct.totalSteps}`;

    mainEl.innerHTML = `
      <div class="stage">
        <div class="eyebrow">${qText.eyebrow}</div>
        <h2 class="question">${qText.question}</h2>
        <p class="question-help">${qText.help}</p>
        <div class="choices">
          <button class="choice-btn" id="btnL"><span class="k">${qText.options.left.k}</span><span class="label">${qText.options.left.label}</span><span class="sub">${qText.options.left.sub}</span></button>
          <button class="choice-btn" id="btnR"><span class="k">${qText.options.right.k}</span><span class="label">${qText.options.right.label}</span><span class="sub">${qText.options.right.sub}</span></button>
        </div>
        ${qStruct.back ? `<button class="back-link" id="btnBack">&larr; ${t().backBtn}</button>` : ''}
      </div>
    `;

    function choose(val, nextId){
      state.path.push({ questionId, value: val });
      renderTrail();
      if(['A','B','C','D','E','F'].includes(nextId)) {
        renderResult(nextId);
      } else {
        renderQuestion(nextId);
      }
    }

    document.getElementById('btnL').onclick = () => choose('no', qStruct.nextNo);
    document.getElementById('btnR').onclick = () => choose('yes', qStruct.nextYes);
    
    if(qStruct.back){
      document.getElementById('btnBack').onclick = () => {
        state.path.pop();
        renderTrail();
        renderQuestion(qStruct.back);
      };
    }
    mainEl.focus();
  }

  function renderResult(key){
    state.currentView = 'result';
    state.activeQuestion = key;
    progressEl.textContent = t().sysComplete;
    const r = t().results[key];
    const dd = t().deepDive;
    const showType = (key === 'A' || key === 'B');
    const showQuantity = (key === 'E');
    const showDeepDive = r.deepDive === true;

    let deepDiveHtml = '';
    if (showDeepDive) {
      deepDiveHtml = `
        <div class="deepdive">
          <button class="deepdive-toggle" id="ddToggle" aria-expanded="false">${dd.toggleLabel} &#9662;</button>
          <div class="deepdive-panel" id="ddPanel" hidden>
            <p class="dd-tag">${dd.levelTag}</p>
            <p class="dd-intro">${dd.panelIntro}</p>
            ${showType ? `
              <p class="dd-question">${dd.typeQuestion}</p>
              <div class="dd-choices">
                <button class="dd-btn" id="ddConsumer">${dd.typeConsumerLabel}</button>
                <button class="dd-btn" id="ddOperational">${dd.typeOperationalLabel}</button>
              </div>
              <div class="dd-result" id="ddTypeResult"></div>
              <p class="dd-footnote">${dd.typeFootnote}</p>
            ` : ''}
            ${showQuantity ? `
              <p class="dd-question">${dd.quantityQuestion}</p>
              <div class="dd-choices dd-choices-3">
                <button class="dd-btn" id="ddHeldTS">${dd.quantityHeldTS}</button>
                <button class="dd-btn" id="ddHeldEHI">${dd.quantityHeldEHI}</button>
                <button class="dd-btn" id="ddHeldBoth">${dd.quantityHeldBoth}</button>
              </div>
              <div id="ddScopeStep" hidden>
                <p class="dd-question">${dd.scopeQuestion}</p>
                <div class="dd-choices">
                  <button class="dd-btn" id="ddDuplicate">${dd.scopeDuplicateLabel}</button>
                  <button class="dd-btn" id="ddDistinct">${dd.scopeDistinctLabel}</button>
                </div>
              </div>
              <div class="dd-result" id="ddQtyResult"></div>
            ` : ''}
          </div>
        </div>
      `;
    }

    const genDate = new Date().toLocaleDateString(currentLang === 'de' ? 'de-DE' : 'en-GB', { year: 'numeric', month: 'long', day: 'numeric' });

    mainEl.innerHTML = `
      <div class="stage cert">
        <div class="seal-medal">${key}</div>
        <h2>${r.title}</h2>
        <div class="cert-body">${r.body}</div>
        <div class="cert-tags">${r.tags.map(tag=>`<span class="tag">${tag}</span>`).join('')}</div>
        ${deepDiveHtml}
        <div class="cert-actions">
          <button class="btn-secondary" id="btnPrint">${t().printBtn}</button>
          <button class="btn-secondary" id="btnCopy">${t().copyBtn}</button>
          <button class="btn-secondary" id="btnRestart">${t().restartBtn}</button>
        </div>
        <div class="print-footer">${t().meta.ownerName} \u00b7 MBA Research Project, Leipzig University &mdash; Generated ${genDate} &mdash; ${t().meta.privacyNotice}</div>
      </div>
    `;
    document.getElementById('btnPrint').onclick = () => window.print();
    document.getElementById('btnCopy').onclick = () => {
      const textToCopy = `Vector [${key}]: ${r.title}\n${r.body}\nTags: ${r.tags.join(', ')}`;
      navigator.clipboard.writeText(textToCopy).then(() => {
        const copyBtn = document.getElementById('btnCopy');
        copyBtn.textContent = t().copySuccess;
        setTimeout(() => copyBtn.textContent = t().copyBtn, 2500);
      });
    };
    document.getElementById('btnRestart').onclick = renderIntro;

    if (showDeepDive) {
      const ddToggle = document.getElementById('ddToggle');
      const ddPanel = document.getElementById('ddPanel');
      ddToggle.onclick = () => {
        const isHidden = ddPanel.hidden;
        ddPanel.hidden = !isHidden;
        ddToggle.setAttribute('aria-expanded', String(isHidden));
      };
      if (showType) {
        document.getElementById('ddConsumer').onclick = () => {
          document.getElementById('ddTypeResult').innerHTML = dd.typeConsumerText;
        };
        document.getElementById('ddOperational').onclick = () => {
          document.getElementById('ddTypeResult').innerHTML = dd.typeOperationalText;
        };
      }
      if (showQuantity) {
        let heldValue = null;
        const scopeStep = document.getElementById('ddScopeStep');
        const qtyResult = document.getElementById('ddQtyResult');
        const selectHeld = (val) => { heldValue = val; scopeStep.hidden = false; qtyResult.innerHTML = ''; };
        document.getElementById('ddHeldTS').onclick = () => selectHeld('ts');
        document.getElementById('ddHeldEHI').onclick = () => selectHeld('ehi');
        document.getElementById('ddHeldBoth').onclick = () => selectHeld('both');
        document.getElementById('ddDuplicate').onclick = () => { qtyResult.innerHTML = dd.resultDuplicate; };
        document.getElementById('ddDistinct').onclick = () => {
          if (heldValue === 'ts') qtyResult.innerHTML = dd.resultDistinctTS;
          else if (heldValue === 'ehi') qtyResult.innerHTML = dd.resultDistinctEHI;
          else qtyResult.innerHTML = dd.resultDistinctBoth;
        };
      }
    }
    mainEl.focus();
  }

  window.addEventListener('keydown', (e) => {
    if (state.currentView === 'question') {
      if (e.key === '1' || e.key === 'ArrowLeft') {
        const btnL = document.getElementById('btnL');
        if (btnL) btnL.click();
      } else if (e.key === '2' || e.key === 'ArrowRight') {
        const btnR = document.getElementById('btnR');
        if (btnR) btnR.click();
      } else if (e.key === 'Backspace') {
        const btnBack = document.getElementById('btnBack');
        if (btnBack) btnBack.click();
      }
    } else if (state.currentView === 'intro' && e.key === 'Enter') {
      const btnStart = document.getElementById('btnStart');
      if (btnStart) btnStart.click();
    }
  });

  langToggle.onclick = () => {
    currentLang = currentLang === 'en' ? 'de' : 'en';
    localStorage.setItem('cert_engine_lang', currentLang);
    updateStaticText();
    if (state.currentView === 'intro') {
      renderIntro();
    } else if (state.currentView === 'question' && state.activeQuestion) {
      renderQuestion(state.activeQuestion);
    } else if (state.currentView === 'result' && state.activeQuestion) {
      renderResult(state.activeQuestion);
    } else {
      renderIntro();
    }
  };

  updateStaticText();
  renderIntro();
})();
</script>
