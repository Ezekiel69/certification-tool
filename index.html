<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certification Decision Engine | German E-Commerce SMEs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* ---------- Frankfurt Financial & Strategy Palette ---------- */
  [data-theme="dark"] {
    --bg-base: #0B0F17;
    --bg-surface: #111827;
    --bg-card: #131C2D;
    --bg-card-hover: #1A263E;
    --border-subtle: #1E2D4A;
    --border-strong: #2E436E;
    --text-main: #F8FAFC;
    --text-muted: #94A3B8;
    --text-dimmed: #64748B;
    --accent: #2563EB;
    --accent-glow: rgba(37, 99, 235, 0.18);
    --accent-border: #60A5FA;
    --success: #059669;
    --success-glow: rgba(5, 150, 105, 0.15);
    --shadow: 0 24px 64px -12px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.04) inset;
    --grid-overlay: linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px), 
                    linear-gradient(0deg, rgba(255,255,255,0.018) 1px, transparent 1px);
  }

  [data-theme="light"] {
    --bg-base: #F4F5F7;
    --bg-surface: #FFFFFF;
    --bg-card: #FAFAFB;
    --bg-card-hover: #F0F2F5;
    --border-subtle: #E2E8F0;
    --border-strong: #CBD5E1;
    --text-main: #0F172A;
    --text-muted: #475569;
    --text-dimmed: #64748B;
    --accent: #1D4ED8;
    --accent-glow: rgba(29, 78, 216, 0.1);
    --accent-border: #1E40AF;
    --success: #047857;
    --success-glow: rgba(4, 120, 87, 0.1);
    --shadow: 0 20px 40px -12px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(15, 23, 42, 0.04) inset;
    --grid-overlay: linear-gradient(90deg, rgba(15,23,42,0.015) 1px, transparent 1px), 
                    linear-gradient(0deg, rgba(15,23,42,0.015) 1px, transparent 1px);
  }

  :root {
    --radius: 8px;
    --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  
  body {
    background-color: var(--bg-base);
    background-image: 
      var(--grid-overlay),
      radial-gradient(circle at 15% 15%, var(--accent-glow) 0%, transparent 50%);
    background-size: 36px 36px, 100% 100%;
    color: var(--text-main);
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 32px 16px;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .wrap {
    background: var(--bg-surface);
    width: 100%;
    max-width: 860px;
    padding: 44px;
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .wrap::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--success));
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border-subtle);
    margin-bottom: 24px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-mark {
    width: 42px; height: 42px;
    background: linear-gradient(135deg, var(--accent), #1E40AF);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono);
    font-size: 15px; font-weight: 700;
    color: #fff;
    box-shadow: 0 4px 14px var(--accent-glow);
  }

  .brand-text h1 {
    font-size: 18px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
    color: var(--text-main);
  }

  .brand-text p {
    margin: 3px 0 0;
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  .ctrl-btn {
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    color: var(--text-main);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .ctrl-btn:hover {
    border-color: var(--accent);
    background: var(--bg-card-hover);
  }

  .progress-badge {
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    padding: 6px 12px;
    border-radius: 20px;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-border);
    letter-spacing: 0.06em;
  }

  /* ---------- Trail / Breadcrumbs ---------- */
  .trail {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }

  .trail-chip {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.04em;
    padding: 5px 10px;
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    color: var(--text-muted);
    background: var(--bg-card);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .trail-chip .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success-glow);
    flex-shrink: 0;
  }

  .trail-chip.no .dot {
    background: var(--text-dimmed);
    box-shadow: none;
  }

  .trail-chip:not(:last-child)::after {
    content: "›";
    margin-left: 8px;
    color: var(--text-dimmed);
    font-size: 14px;
  }

  /* ---------- Stage / Questions ---------- */
  main { min-height: 380px; position: relative; }
  
  .stage {
    animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent-border);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .eyebrow::before {
    content: "";
    width: 12px; height: 2px;
    background: var(--accent);
    display: inline-block;
  }

  .question {
    font-size: clamp(22px, 3.2vw, 28px);
    font-weight: 700;
    line-height: 1.35;
    color: var(--text-main);
    margin: 0 0 10px;
    letter-spacing: -0.02em;
  }

  .question-help {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.6;
    max-width: 58ch;
    margin: 0 0 28px;
  }

  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media(max-width: 640px) { .choices { grid-template-columns: 1fr; } }

  .choice-btn {
    text-align: left;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    padding: 20px;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    position: relative;
  }

  .choice-btn:hover {
    background: var(--bg-card-hover);
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25), 
                0 0 0 1px var(--accent-glow);
  }

  .choice-btn .k {
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 10px;
    color: var(--accent-border);
    letter-spacing: 0.1em;
    display: block;
    margin-bottom: 8px;
  }

  .choice-btn .label {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-main);
    display: block;
    margin-bottom: 6px;
  }

  .choice-btn .sub {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .back-link {
    margin-top: 24px;
    background: none; border: none;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 11.5px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 6px 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: color 0.15s ease;
  }
  .back-link:hover { color: var(--text-main); }

  /* ---------- Intro Screen ---------- */
  .intro h2 {
    font-size: clamp(24px, 3.8vw, 32px);
    font-weight: 700;
    line-height: 1.25;
    margin: 0 0 14px;
    letter-spacing: -0.02em;
    color: var(--text-main);
  }

  .intro p {
    font-size: 14.5px;
    color: var(--text-muted);
    line-height: 1.7;
    max-width: 62ch;
    margin: 0 0 20px;
  }

  .intro .grounding {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent-border);
    background: var(--accent-glow);
    border: 1px solid var(--border-strong);
    border-left: 3px solid var(--accent);
    padding: 12px 16px;
    border-radius: 0 var(--radius) var(--radius) 0;
    margin: 24px 0 30px;
    line-height: 1.6;
  }

  .start-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 14px;
    padding: 14px 28px;
    border-radius: var(--radius);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: all 0.2s ease;
    box-shadow: 0 4px 16px var(--accent-glow);
  }
  .start-btn:hover {
    filter: brightness(1.1);
    transform: translateY(-1px);
  }
  .start-btn svg { width: 14px; height: 14px; }

  /* ---------- Results Screen ---------- */
  .cert {
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    padding: 36px;
    border-radius: var(--radius);
    text-align: center;
    position: relative;
  }

  .seal-medal {
    width: 64px; height: 64px;
    margin: 0 auto 18px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--success), #047857);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 4px var(--bg-surface), 0 0 20px var(--success-glow);
  }

  .seal-medal span {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 700;
    color: #fff;
  }

  .cert-eyebrow {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent-border);
    margin-bottom: 8px;
  }

  .cert h2 {
    font-size: clamp(20px, 3vw, 25px);
    font-weight: 700;
    line-height: 1.3;
    margin: 0 0 16px;
    color: var(--text-main);
  }

  .cert-body {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-muted);
    text-align: left;
    max-width: 54ch;
    margin: 0 auto 24px;
  }

  .cert-tags {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .tag {
    font-family: var(--font-mono);
    font-size: 10.5px;
    padding: 4px 10px;
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    color: var(--text-main);
    background: var(--bg-surface);
  }

  .cert-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    padding-top: 20px;
    border-top: 1px solid var(--border-subtle);
  }

  .btn-secondary {
    background: var(--bg-surface);
    border: 1px solid var(--border-strong);
    color: var(--text-main);
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-secondary:hover {
    background: var(--bg-card-hover);
    border-color: var(--text-muted);
  }

  /* ---------- Footer ---------- */
  footer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--border-subtle);
    font-size: 11.5px;
    color: var(--text-dimmed);
    line-height: 1.6;
  }

  @media print {
    body { background: #fff !important; color: #000 !important; padding: 0; }
    .wrap { background: #fff !important; border: none; box-shadow: none; color: #000 !important; padding: 0; }
    .choice-btn, .cert { background: #f9fafb !important; border: 1px solid #d1d5db !important; color: #111 !important; }
    .question, .intro h2, .cert h2 { color: #111 !important; }
    header .header-controls, .trail, .back-link, .start-btn, .cert-actions, footer .no-print { display: none !important; }
  }
</style>
</head>

        help: "Bewertet den administrativen Aufwand im Verhältnis zur Firmengröße und verfügbaren Arbeitsstunden.",
        options: {
          left: { k: "AUSREICHEND", label: "Dedizierte operative Kapazität", sub: "Personal verfügbar für jährliche Audit-Schleifen und Dokumentation." },
          right: { k: "EINGESCHRÄNKT", label: "Schlankes Team / enge Grenzen", sub: "Operative Bandbreite ist durch Kerngeschäft voll ausgelastet." }
        }
      },
      tracking: {
        trailLabel: "Telemetrie",
        eyebrow: "Knoten 02 \u00b7 Prozedurale Variable",
        question: "Messen Sie aktiv den Einfluss der Zertifizierung auf Conversion oder Bewertungen?",
        help: "Differentiert passive Verlängerungsgewohnheiten von empirischem Performance-Tracking.",
        options: {
          left: { k: "NICHT GEMESSEN", label: "Kein Tracking-Mechanismus", sub: "Verlängerung aus Gewohnheit statt kalkulierter Return-Metriken." },
          right: { k: "ÜBERWACHT", label: "Aktive Beobachtung", sub: "Verfolgung von Feedback oder Support-Metriken rund um Verlängerungstermine." }
        }
      },
      evidence: {
        trailLabel: "Ertragsanalyse",
        eyebrow: "Knoten 03 \u00b7 Performance-Validierung",
        question: "Weisen Ihre Telemetriedaten einen messbaren kommerziellen Ertrag nach?",
        help: "Beurteilt, ob sich das Verbraucherverhalten parallel zum Zertifizierungsstatus sichtbar ändert.",
        options: {
          left: { k: "POSITIV", label: "Klarer positiver Ertrag", sub: "Messbare Verbesserungen bei Vertrauensmetriken, Conversion oder Feedback." },
          right: { k: "UNCLEAR", label: "Mehrdeutig oder neutral", sub: "Korrelation zu Umsatz oder Marktstellung schwach oder schwer isolierbar." }
        }
      }
    },
    results: {
      A: { title: "Zertifizierung mit integrierten Tracking-Schleifen anstreben", tags: ["Umwelt", "Organisational", "Kap. 8.1"], body: `Ihr Marktumfeld und Ihre Teamkapazität rechtfertigen die Investition. Etablieren Sie unbedingt vorab Tracking-Baselines—wie Überwachung der Review-Geschwindigkeit oder Befragung neuer Kohorten —, um Nach-Audit-Unklarheiten zu vermeiden.` },
      B: { title: "Akquise zurückstellen; erst interne Kapazität aufbauen", tags: ["Organisational", "Kap. 8.2"], body: `Die Marktnachfrage unterstützt die Zertifizierung, aber schlanke Rahmenbedingungen bergen das Risiko administrativer Überlastung. Ernennen Sie einen Compliance-Verantwortlichen oder prüfen Sie leichtgewichtige Alternativen.` },
      C: { title: "Organische Vertrauensbildungspraktiken konsolidieren", tags: ["Umwelt", "Kap. 5.4.2"], body: `Bei einer etablierten Kundenbasis bringen Drittanbietersiegel geringen Zusatznutzen. Priorisieren Sie direktes Feedback-Management, Transparenz und Kundenbindung vor formalen Siegeln.` },
      D: { title: "Performance-Telemetrie vor Verlängerung implementieren", tags: ["Technologisch", "Kap. 8.1"], body: `Aktive Zertifizierung ist sinnvoll, aber Verlängerung auf Vermutung birgt Ineffizienzen. Korrelieren Sie aktuelle Bewertungskurven und Akquise-Metriken vor der nächsten Laufzeitentscheidung.` },
      E: { title: "Status beibehalten und empirische Belege nutzen", tags: ["Technologisch", "Kap. 8.1"], body: `Sie verfügen über nachgewiesene Renditen aus der Zertifizierung. Integrieren Sie diese Erkenntnisse in Ihre Marketingkommunikation—empirische Validierung konvertiert besser als reine Siegelanzeige.` },
      F: { title: "Institutionalisierten Signalling-Wert vor Aufgabe prüfen", tags: ["Institutional", "Kap. 6.4"], body: `Fehlender Direktumsatz entwertet den Nutzen nicht. Zertifizierungen fungieren oft als elementarer Hygienefaktor; ein Wegfall könnte unbeabsichtigte Kundenverunsicherung hervorrufen.` }
    }
  }
};

const ASSESSMENT_CONFIG = {
  startQuestion: 'certified',
  structure: {
    certified: { nextNo: 'audience', nextYes: 'tracking', totalSteps: 3, stepNumber: 1, back: null },
    audience: { nextNo: 'C', nextYes: 'capacity', totalSteps: 3, stepNumber: 2, back: 'certified' },
    capacity: { nextNo: 'B', nextYes: 'A', totalSteps: 3, stepNumber: 3, back: 'audience' },
    tracking: { nextNo: 'D', nextYes: 'evidence', totalSteps: 3, stepNumber: 2, back: 'certified' },
    evidence: { nextNo: 'F', nextYes: 'E', totalSteps: 3, stepNumber: 3, back: 'tracking' }
  }
};

(function(){
  let currentLang = 'en';
  let currentTheme = 'dark';
  let state = { path: [] };

  const trailEl = document.getElementById('trail');
  const mainEl = document.getElementById('main');
  const progressEl = document.getElementById('progressLabel');
  const headerTitle = document.getElementById('headerTitle');
  const headerSub = document.getElementById('headerSub');
  const langToggle = document.getElementById('langToggle');
  const themeToggle = document.getElementById('themeToggle');
  const footerGrounding = document.getElementById('footerGrounding');
  const footerDisclaimer = document.getElementById('footerDisclaimer');

  function t() { return I18N[currentLang]; }

  function updateStaticText() {
    headerTitle.textContent = t().headerTitle;
    headerSub.textContent = t().headerSub;
    footerGrounding.innerHTML = t().meta.footerGrounding;
    footerDisclaimer.innerHTML = t().meta.footerDisclaimer;
    langToggle.textContent = currentLang === 'en' ? 'DE / EN' : 'EN / DE';
    themeToggle.textContent = currentTheme === 'dark' 
      ? (currentLang === 'en' ? 'Theme: Frankfurt Dark' : 'Design: Frankfurt Dunkel') 
      : (currentLang === 'en' ? 'Theme: Light' : 'Design: Hell');
  }

  function icon(kind){
    if(kind==='arrow') return '<svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 7H12M12 7L7.5 2.5M12 7L7.5 11.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    return '';
  }

  function renderTrail(){
    trailEl.innerHTML = state.path.map(step => {
      const qConfig = t().questions[step.questionId];
      return `<span class="trail-chip ${step.value==='no' ? 'no' : ''}"><span class="dot"></span>${qConfig.trailLabel}: ${step.value.toUpperCase()}</span>`;
    }).join('');
  }

  function renderIntro(){
    progressEl.textContent = t().sysReady;
    state = { path: [] };
    renderTrail();
    mainEl.innerHTML = `
      <div class="stage intro">
        <div class="eyebrow">${t().meta.introEyebrow}</div>
        <h2>${t().meta.title}</h2>
        <p>${t().meta.introBody}</p>
        <div class="grounding">${t().meta.introGrounding}</div>
        <button class="start-btn" id="btnStart">${t().startBtn} ${icon('arrow')}</button>
      </div>
    `;
    document.getElementById('btnStart').onclick = () => renderQuestion(ASSESSMENT_CONFIG.startQuestion);
  }

  function renderQuestion(questionId){
    const qStruct = ASSESSMENT_CONFIG.structure[questionId];
    const qText = t().questions[questionId];
    progressEl.textContent = `NODE ${qStruct.stepNumber} / ${qStruct.totalSteps}`;

    mainEl.innerHTML = `
      <div class="stage">
        <div class="eyebrow">${qText.eyebrow}</div>
        <h2 class="question">${qText.question}</h2>
        <p class="question-help">${qText.help}</p>
        <div class="choices">
          <button class="choice-btn" id="btnL"><span class="k">${qText.options.left.k}</span><span class="label">${qText.options.left.label}</span><span class="sub">${qText.options.left.sub}</span></button>
          <button class="choice-btn" id="btnR"><span class="k">${qText.options.right.k}</span><span class="label">${qText.options.right.label}</span><span class="sub">${qText.options.right.sub}</span></button>
        </div>
        ${qStruct.back ? `<button class="back-link" id="btnBack">&larr; ${t().backBtn}</button>` : ''}
      </div>
    `;

    function choose(val, nextId){
      state.path.push({ questionId, value: val });
      renderTrail();
      if(['A','B','C','D','E','F'].includes(nextId)) {
        renderResult(nextId);
      } else {
        renderQuestion(nextId);
      }
    }

    document.getElementById('btnL').onclick = () => choose('no', qStruct.nextNo);
    document.getElementById('btnR').onclick = () => choose('yes', qStruct.nextYes);
    
    if(qStruct.back){
      document.getElementById('btnBack').onclick = () => {
        state.path.pop();
        renderTrail();
        renderQuestion(qStruct.back);
      };
    }
  }

  function renderResult(key){
    progressEl.textContent = t().sysComplete;
    const r = t().results[key];
    mainEl.innerHTML = `
      <div class="stage cert">
        <div class="seal-medal"><span>${key}</span></div>
        <div class="cert-eyebrow">Strategic Outcome Vector — ${key}</div>
        <h2>${r.title}</h2>
        <div class="cert-body">${r.body}</div>
        <div class="cert-tags">${r.tags.map(tag=>`<span class="tag">${tag}</span>`).join('')}</div>
        <div class="cert-actions">
          <button class="btn-secondary" id="btnPrint">${t().printBtn}</button>
          <button class="btn-secondary" id="btnRestart">${t().restartBtn}</button>
        </div>
      </div>
    `;
    document.getElementById('btnPrint').onclick = () => window.print();
    document.getElementById('btnRestart').onclick = renderIntro;
  }

  langToggle.onclick = () => {
    currentLang = currentLang === 'en' ? 'de' : 'en';
    updateStaticText();
    renderIntro();
  };

  themeToggle.onclick = () => {
    currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', currentTheme);
    updateStaticText();
  };

  document.documentElement.setAttribute('data-theme', currentTheme);
  updateStaticText();
  renderIntro();
})();
</script>
</body>
</html>
