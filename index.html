<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certification Decision Engine | German E-Commerce SMEs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Professional Editorial Mix: Warm Stone, Charcoal, Terracotta & Moss */
    --bg-base: #F4F3EE;
    --bg-surface: #FFFFFF;
    --bg-card: #FAF9F5;
    --bg-card-hover: #EFECE4;
    --border-subtle: #DFDCD0;
    --border-strong: #C8C3B4;
    --text-main: #181816;
    --text-muted: #625F56;
    --text-dimmed: #969185;
    --accent: #7A3E2D; /* Sophisticated Warm Terracotta / Clay */
    --success: #364A33; /* Deep Muted Forest Moss */
    --shadow: 0 20px 40px -12px rgba(24, 24, 22, 0.08), 0 0 0 1px rgba(24, 24, 22, 0.04);
    
    --radius: 6px;
    --font-serif: 'Instrument Serif', Georgia, serif;
    --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  
  body {
    background-color: var(--bg-base);
    color: var(--text-main);
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 16px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    background: var(--bg-surface);
    width: 100%;
    max-width: 860px;
    padding: 52px;
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    box-shadow: var(--shadow);
    position: relative;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border-subtle);
    margin-bottom: 32px;
  }

  .brand-text h1 {
    font-family: var(--font-serif);
    font-size: 28px;
    font-weight: 400;
    margin: 0;
    letter-spacing: -0.01em;
    color: var(--text-main);
  }

  .brand-text p {
    margin: 4px 0 0;
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .ctrl-btn {
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    color: var(--text-main);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .ctrl-btn:hover {
    border-color: var(--accent);
    background: var(--bg-card-hover);
  }

  .progress-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.04em;
  }

  /* ---------- Trail / Breadcrumbs ---------- */
  .trail {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .trail-chip {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 4px 10px;
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    color: var(--text-muted);
    background: var(--bg-card);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .trail-chip .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--success);
  }

  .trail-chip.no .dot {
    background: var(--text-dimmed);
  }

  .trail-chip:not(:last-child)::after {
    content: "—";
    margin-left: 6px;
    color: var(--text-dimmed);
  }

  /* ---------- Stage / Questions ---------- */
  main { min-height: 380px; position: relative; }
  
  .stage {
    animation: fadeIn 0.25s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }

  .question {
    font-family: var(--font-serif);
    font-size: clamp(30px, 4vw, 38px);
    font-weight: 400;
    line-height: 1.15;
    color: var(--text-main);
    margin: 0 0 12px;
  }

  .question-help {
    font-size: 14.5px;
    color: var(--text-muted);
    line-height: 1.6;
    max-width: 56ch;
    margin: 0 0 28px;
  }

  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media(max-width: 640px) { .choices { grid-template-columns: 1fr; } }

  .choice-btn {
    text-align: left;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    padding: 24px;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: all 0.15s ease;
  }

  .choice-btn:hover {
    background: var(--bg-card-hover);
    border-color: var(--text-main);
  }

  .choice-btn .k {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    display: block;
    margin-bottom: 8px;
  }

  .choice-btn .label {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-main);
    display: block;
    margin-bottom: 6px;
  }

  .choice-btn .sub {
    font-size: 13.5px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .back-link {
    margin-top: 24px;
    background: none; border: none;
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .back-link:hover { color: var(--text-main); }

  /* ---------- Owner & Tool Introduction Screen ---------- */
  .intro-card {
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    padding: 36px;
    border-radius: var(--radius);
  }

  .owner-bio {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border-subtle);
  }

  .owner-avatar {
    width: 50px; height: 50px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 16px;
  }

  .owner-details h3 {
    margin: 0 0 4px;
    font-size: 16px;
    font-weight: 600;
    color: var(--text-main);
  }

  .owner-details p {
    margin: 0;
    font-size: 13px;
    color: var(--text-muted);
  }

  .intro-card h2 {
    font-family: var(--font-serif);
    font-size: clamp(30px, 4vw, 36px);
    font-weight: 400;
    line-height: 1.2;
    margin: 0 0 14px;
    color: var(--text-main);
  }

  .intro-card p {
    font-size: 14.5px;
    color: var(--text-muted);
    line-height: 1.7;
    margin: 0 0 20px;
  }

  .instruction-box {
    background: var(--bg-surface);
    border: 1px solid var(--border-subtle);
    border-left: 3px solid var(--accent);
    padding: 16px 20px;
    border-radius: 0 var(--radius) var(--radius) 0;
    margin-bottom: 28px;
  }

  .instruction-box h4 {
    margin: 0 0 6px;
    font-size: 13px;
    font-family: var(--font-mono);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--accent);
  }

  .instruction-box p {
    margin: 0;
    font-size: 13.5px;
    color: var(--text-main);
    line-height: 1.5;
  }

  .start-btn {
    background: var(--text-main);
    color: var(--bg-surface);
    border: none;
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 14px;
    padding: 14px 28px;
    border-radius: var(--radius);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: background 0.15s ease;
  }
  .start-btn:hover { background: var(--accent); }

  /* ---------- Results Screen ---------- */
  .cert {
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    padding: 36px;
    border-radius: var(--radius);
    text-align: center;
  }

  .seal-medal {
    width: 52px; height: 52px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--success);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 500;
  }

  .cert h2 {
    font-family: var(--font-serif);
    font-size: 28px;
    font-weight: 400;
    line-height: 1.2;
    margin: 0 0 16px;
    color: var(--text-main);
  }

  .cert-body {
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--text-muted);
    text-align: left;
    max-width: 52ch;
    margin: 0 auto 24px;
  }

  .cert-tags {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .tag {
    font-family: var(--font-mono);
    font-size: 10.5px;
    padding: 4px 10px;
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    color: var(--text-muted);
    background: var(--bg-surface);
  }

  .cert-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    padding-top: 20px;
    border-top: 1px solid var(--border-subtle);
  }

  .btn-secondary {
    background: var(--bg-surface);
    border: 1px solid var(--border-strong);
    color: var(--text-main);
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-secondary:hover { border-color: var(--text-main); }

  /* ---------- Footer ---------- */
  footer {
    margin-top: 36px;
    padding-top: 16px;
    border-top: 1px solid var(--border-subtle);
    font-size: 11.5px;
    color: var(--text-dimmed);
    line-height: 1.6;
  }

  @media print {
    body { background: #fff !important; }
    .wrap { border: none; box-shadow: none; padding: 0; }
    header .header-controls, .trail, .back-link, .start-btn, .cert-actions, footer .no-print { display: none !important; }
  }
</style>
</head>

</div>

  const headerSub = document.getElementById('headerSub');
  const langToggle = document.getElementById('langToggle');
  const footerGrounding = document.getElementById('footerGrounding');

  function t() { return I18N[currentLang]; }

  function updateStaticText() {
    headerTitle.textContent = t().headerTitle;
    headerSub.textContent = t().headerSub;
    footerGrounding.innerHTML = t().meta.footerGrounding;
    langToggle.textContent = currentLang === 'en' ? 'DE / EN' : 'EN / DE';
  }

  function renderTrail(){
    trailEl.innerHTML = state.path.map(step => {
      const qConfig = t().questions[step.questionId];
      return `<span class="trail-chip ${step.value==='no' ? 'no' : ''}"><span class="dot"></span>${qConfig.trailLabel}: ${step.value.toUpperCase()}</span>`;
    }).join('');
  }

  function renderIntro(){
    progressEl.textContent = t().sysReady;
    state = { path: [] };
    renderTrail();
    mainEl.innerHTML = `
      <div class="stage intro-card">
        <div class="owner-bio">
          <div class="owner-avatar">RA</div>
          <div class="owner-details">
            <h3>${t().meta.ownerName}</h3>
            <p>${t().meta.ownerRole}</p>
          </div>
        </div>
        <h2>${t().meta.title}</h2>
        <p>${t().meta.introIntro}</p>
        <div class="instruction-box">
          <h4>${t().meta.instructionTitle}</h4>
          <p>${t().meta.instructionText}</p>
        </div>
        <button class="start-btn" id="btnStart">${t().startBtn}</button>
      </div>
    `;
    document.getElementById('btnStart').onclick = () => renderQuestion(ASSESSMENT_CONFIG.startQuestion);
  }

  function renderQuestion(questionId){
    const qStruct = ASSESSMENT_CONFIG.structure[questionId];
    const qText = t().questions[questionId];
    progressEl.textContent = `${qStruct.stepNumber} / ${qStruct.totalSteps}`;

    mainEl.innerHTML = `
      <div class="stage">
        <div class="eyebrow">${qText.eyebrow}</div>
        <h2 class="question">${qText.question}</h2>
        <p class="question-help">${qText.help}</p>
        <div class="choices">
          <button class="choice-btn" id="btnL"><span class="k">${qText.options.left.k}</span><span class="label">${qText.options.left.label}</span><span class="sub">${qText.options.left.sub}</span></button>
          <button class="choice-btn" id="btnR"><span class="k">${qText.options.right.k}</span><span class="label">${qText.options.right.label}</span><span class="sub">${qText.options.right.sub}</span></button>
        </div>
        ${qStruct.back ? `<button class="back-link" id="btnBack">&larr; ${t().backBtn}</button>` : ''}
      </div>
    `;

    function choose(val, nextId){
      state.path.push({ questionId, value: val });
      renderTrail();
      if(['A','B','C','D','E','F'].includes(nextId)) {
        renderResult(nextId);
      } else {
        renderQuestion(nextId);
      }
    }

    document.getElementById('btnL').onclick = () => choose('no', qStruct.nextNo);
    document.getElementById('btnR').onclick = () => choose('yes', qStruct.nextYes);
    
    if(qStruct.back){
      document.getElementById('btnBack').onclick = () => {
        state.path.pop();
        renderTrail();
        renderQuestion(qStruct.back);
      };
    }
  }

  function renderResult(key){
    progressEl.textContent = t().sysComplete;
    const r = t().results[key];
    mainEl.innerHTML = `
      <div class="stage cert">
        <div class="seal-medal">${key}</div>
        <h2>${r.title}</h2>
        <div class="cert-body">${r.body}</div>
        <div class="cert-tags">${r.tags.map(tag=>`<span class="tag">${tag}</span>`).join('')}</div>
        <div class="cert-actions">
          <button class="btn-secondary" id="btnPrint">${t().printBtn}</button>
          <button class="btn-secondary" id="btnRestart">${t().restartBtn}</button>
        </div>
      </div>
    `;
    document.getElementById('btnPrint').onclick = () => window.print();
    document.getElementById('btnRestart').onclick = renderIntro;
  }

  langToggle.onclick = () => {
    currentLang = currentLang === 'en' ? 'de' : 'en';
    updateStaticText();
    renderIntro();
  };

  updateStaticText();
  renderIntro();
})();
</script>
</body>
</html>
