<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certification Decision Engine | German E-Commerce SMEs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Human-Centric Editorial Palette */
    --bg-base: #F5F4F0;
    --bg-surface: #FFFFFF;
    --bg-card: #FAF9F5;
    --bg-card-hover: #F0EEE6;
    --border-subtle: #E3DFD5;
    --border-strong: #CEC7B8;
    --text-main: #1C1B18;
    --text-muted: #6B675E;
    --text-dimmed: #9E998E;
    --accent: #8C4A32; /* Warm Clay / Terracotta */
    --success: #3B5336; /* Muted Forest Sage */
    --shadow: 0 16px 32px -8px rgba(28, 27, 24, 0.06), 0 0 0 1px rgba(28, 27, 24, 0.04);
    
    --radius: 6px;
    --font-serif: 'Instrument Serif', Georgia, serif;
    --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  
  body {
    background-color: var(--bg-base);
    color: var(--text-main);
    font-family: var(--font-sans);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 16px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    background: var(--bg-surface);
    width: 100%;
    max-width: 860px;
    padding: 52px;
    border: 1px solid var(--border-subtle);
    border-radius: 12px;
    box-shadow: var(--shadow);
    position: relative;
  }

  /* ---------- Header ---------- */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border-subtle);
    margin-bottom: 32px;
  }

  .brand-text h1 {
    font-family: var(--font-serif);
    font-size: 26px;
    font-weight: 400;
    margin: 0;
    color: var(--text-main);
  }

  .brand-text p {
    margin: 4px 0 0;
    font-size: 11px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .header-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .ctrl-btn {
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    color: var(--text-main);
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    padding: 6px 12px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .ctrl-btn:hover {
    border-color: var(--accent);
    background: var(--bg-card-hover);
  }

  .progress-badge {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.04em;
  }

  /* ---------- Trail / Breadcrumbs ---------- */
  .trail {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 32px;
    flex-wrap: wrap;
  }

  .trail-chip {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 4px 10px;
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    color: var(--text-muted);
    background: var(--bg-card);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .trail-chip .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--success);
  }

  .trail-chip.no .dot {
    background: var(--text-dimmed);
  }

  .trail-chip:not(:last-child)::after {
    content: "—";
    margin-left: 6px;
    color: var(--text-dimmed);
  }

  /* ---------- Stage / Questions ---------- */
  main { min-height: 380px; position: relative; }
  
  .stage {
    animation: fadeIn 0.25s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 12px;
  }

  .question {
    font-family: var(--font-serif);
    font-size: clamp(30px, 4vw, 38px);
    font-weight: 400;
    line-height: 1.15;
    color: var(--text-main);
    margin: 0 0 12px;
  }

  .question-help {
    font-size: 14.5px;
    color: var(--text-muted);
    line-height: 1.6;
    max-width: 56ch;
    margin: 0 0 32px;
  }

  .choices {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  @media(max-width: 640px) { .choices { grid-template-columns: 1fr; } }

  .choice-btn {
    text-align: left;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius);
    padding: 24px;
    cursor: pointer;
    font-family: var(--font-sans);
    transition: all 0.15s ease;
  }

  .choice-btn:hover {
    background: var(--bg-card-hover);
    border-color: var(--text-main);
  }

  .choice-btn .k {
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    display: block;
    margin-bottom: 8px;
  }

  .choice-btn .label {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-main);
    display: block;
    margin-bottom: 6px;
  }

  .choice-btn .sub {
    font-size: 13.5px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .back-link {
    margin-top: 28px;
    background: none; border: none;
    font-family: var(--font-mono);
    font-weight: 500;
    font-size: 11px;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .back-link:hover { color: var(--text-main); }

  /* ---------- Intro / Owner Welcome Screen ---------- */
  .intro h2 {
    font-family: var(--font-serif);
    font-size: clamp(34px, 4.5vw, 44px);
    font-weight: 400;
    line-height: 1.15;
    margin: 0 0 16px;
    color: var(--text-main);
  }

  .intro p {
    font-size: 15px;
    color: var(--text-muted);
    line-height: 1.7;
    max-width: 60ch;
    margin: 0 0 24px;
  }

  .owner-card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    padding: 16px 20px;
    border-radius: var(--radius);
    margin: 24px 0;
  }

  .owner-avatar {
    width: 44px; height: 44px;
    background: var(--accent);
    color: #fff;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-serif);
    font-size: 20px;
    flex-shrink: 0;
  }

  .owner-info h3 {
    margin: 0 0 2px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-main);
  }

  .owner-info p {
    margin: 0;
    font-size: 13px;
    color: var(--text-muted);
    font-family: var(--font-mono);
  }

  .intro .instruction-box {
    font-size: 13.5px;
    color: var(--text-main);
    background: var(--bg-card);
    border: 1px solid var(--border-subtle);
    border-left: 3px solid var(--accent);
    padding: 14px 18px;
    border-radius: 0 var(--radius) var(--radius) 0;
    margin-bottom: 32px;
    line-height: 1.6;
  }

  .start-btn {
    background: var(--text-main);
    color: var(--bg-surface);
    border: none;
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 14px;
    padding: 14px 28px;
    border-radius: var(--radius);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    transition: background 0.15s ease;
  }
  .start-btn:hover { background: var(--accent); }

  /* ---------- Results Screen ---------- */
  .cert {
    background: var(--bg-card);
    border: 1px solid var(--border-strong);
    padding: 40px;
    border-radius: var(--radius);
    text-align: center;
  }

  .seal-medal {
    width: 56px; height: 56px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: var(--success);
    display: flex; align-items: center; justify-content: center;
    color: #fff;
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 500;
  }

  .cert h2 {
    font-family: var(--font-serif);
    font-size: 30px;
    font-weight: 400;
    line-height: 1.2;
    margin: 0 0 16px;
    color: var(--text-main);
  }

  .cert-body {
    font-size: 14.5px;
    line-height: 1.7;
    color: var(--text-muted);
    text-align: left;
    max-width: 52ch;
    margin: 0 auto 24px;
  }

  .cert-tags {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 28px;
  }

  .tag {
    font-family: var(--font-mono);
    font-size: 10.5px;
    padding: 4px 10px;
    border: 1px solid var(--border-subtle);
    border-radius: 4px;
    color: var(--text-muted);
    background: var(--bg-surface);
  }

  .cert-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
    padding-top: 24px;
    border-top: 1px solid var(--border-subtle);
  }

  .btn-secondary {
    background: var(--bg-surface);
    border: 1px solid var(--border-strong);
    color: var(--text-main);
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 13px;
    padding: 10px 20px;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .btn-secondary:hover { border-color: var(--text-main); }

  /* ---------- Footer ---------- */
  footer {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--border-subtle);
    font-size: 11.5px;
    color: var(--text-dimmed);
    line-height: 1.6;
  }

  @media print {
    body { background: #fff !important; }
    .wrap { border: none; box-shadow: none; padding: 0; }
    header .header-controls, .trail, .back-link, .start-btn, .cert-actions, footer .no-print { display: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">

    <div class="brand-text">

  <div class="trail" id="trail"></div>

  </footer>

</div>

(function(){

  let state = { path: [] };

  const trailEl = document.getElementById('trail');
  const mainEl = document.getElementById('main');

  function updateStaticText() {

    trailEl.innerHTML = state.path.map(step => {
      const qConfig = t().questions[step.questionId];
      return `<span class="trail-chip ${step.value==='no' ? 'no' : ''}"><span class="dot"></span>${qConfig.trailLabel}: ${step.value.toUpperCase()}</span>`;
    }).join('');
  }

  function renderIntro(){
    progressEl.textContent = t().sysReady;
    state = { path: [] };
    renderTrail();
    mainEl.innerHTML = `
      <div class="stage intro">
        <h2>${t().meta.title}</h2>
        <p>${t().meta.introBody}</p>
        
        <div class="owner-card">
          <div class="owner-avatar">M</div>
          <div class="owner-info">
            <h3>${t().meta.ownerName}</h3>
            <p>${t().meta.ownerRole}</p>
          </div>
        </div>

        <div class="instruction-box">
          <strong>${t().meta.instructionHeader}</strong><br>
          ${t().meta.instructionBody}
        </div>

        <button class="start-btn" id="btnStart">${t().startBtn}</button>
      </div>
    `;
    document.getElementById('btnStart').onclick = () => renderQuestion(ASSESSMENT_CONFIG.startQuestion);
  }

  function renderQuestion(questionId){
    const qStruct = ASSESSMENT_CONFIG.structure[questionId];
    const qText = t().questions[questionId];
    progressEl.textContent = `STEP ${qStruct.stepNumber} / ${qStruct.totalSteps}`;

    mainEl.innerHTML = `
      <div class="stage">
        <div class="eyebrow">${qText.eyebrow}</div>
        <h2 class="question">${qText.question}</h2>
        <p class="question-help">${qText.help}</p>
        <div class="choices">
          <button class="choice-btn" id="btnL"><span class="k">${qText.options.left.k}</span><span class="label">${qText.options.left.label}</span><span class="sub">${qText.options.left.sub}</span></button>
          <button class="choice-btn" id="btnR"><span class="k">${qText.options.right.k}</span><span class="label">${qText.options.right.label}</span><span class="sub">${qText.options.right.sub}</span></button>
        </div>
        ${qStruct.back ? `<button class="back-link" id="btnBack">&larr; ${t().backBtn}</button>` : `<button class="back-link" id="btnBack">&larr; Overview</button>`}
      </div>
    `;

    function choose(val, nextId){
      state.path.push({ questionId, value: val });
      renderTrail();
      if(['A','B','C','D','E','F'].includes(nextId)) {
        renderResult(nextId);
      } else {
        renderQuestion(nextId);
      }
    }

    document.getElementById('btnL').onclick = () => choose('no', qStruct.nextNo);
    document.getElementById('btnR').onclick = () => choose('yes', qStruct.nextYes);
    
    document.getElementById('btnBack').onclick = () => {
      if(qStruct.back) {
        state.path.pop();
        renderTrail();
        renderQuestion(qStruct.back);
      } else {
        renderIntro();
      }
    };
  }

  function renderResult(key){
    progressEl.textContent = t().sysComplete;
    const r = t().results[key];
    mainEl.innerHTML = `
      <div class="stage cert">
        <div class="seal-medal">${key}</div>
        <h2>${r.title}</h2>
        <div class="cert-body">${r.body}</div>
        <div class="cert-tags">${r.tags.map(tag=>`<span class="tag">${tag}</span>`).join('')}</div>
        <div class="cert-actions">
          <button class="btn-secondary" id="btnPrint">${t().printBtn}</button>
          <button class="btn-secondary" id="btnRestart">${t().restartBtn}</button>
        </div>
      </div>
    `;
    document.getElementById('btnPrint').onclick = () => window.print();
    document.getElementById('btnRestart').onclick = renderIntro;
  }

  langToggle.onclick = () => {
    currentLang = currentLang === 'en' ? 'de' : 'en';
    updateStaticText();
    renderIntro();
  };

  updateStaticText();
  renderIntro();
})();
</script>
</body>
</html>
